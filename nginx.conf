server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers générés avec un nom unique : conservés un an
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Page d'entrée : toujours relue, pour prendre les nouvelles versions
    location = /index.html {
        expires -1;
    }

    # Application à page unique : toute autre adresse renvoie la page d'entrée
    location / {
        try_files $uri $uri/ /index.html;
    }
}
